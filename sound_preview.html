<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sound Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="static/css/style.css?v=d8124013">
<style>
  main { max-width: 1400px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 36px; }
  .row h2 { grid-column: 1 / -1; font-size: 1.15rem; margin: 0; }
  figure { margin: 0; }
  figure video { display: block; width: 100%; height: auto; border-radius: 10px; background: #101118; }
  figcaption { margin-top: 6px; font-weight: 600; }
  figcaption a { color: inherit; }
  figcaption span { display: block; font-weight: 400; color: var(--muted); font-size: 0.9rem; }
  @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Sound options for the inference-time videos</h1>
  <p class="lead">Real engine recordings, rev-synced: the engine's own rev-up plays when the speed-up on the dial rises, its rev-down when it falls. Turn the sound on. The main page has no sound for now.</p>
  <section class="row"><h2>Trash cleanup (q99)</h2>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_trash_huracan.mp4"></video><figcaption>A · Lamborghini Huracán V10, start-up only<span>real rev-up / rev-down cut from the start-up (1.15–2.9 s) in sync with the dial; the clean idle right after it (3.0–4.2 s) when the speed-up holds. The later part with voices and birds is not used. Source: <a href="https://freesound.org/people/JaimeLopes/sounds/564373/">Freesound #564373</a> by JaimeLopes, CC0.</span></figcaption></figure>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_trash_f355.mp4"></video><figcaption>B · Ferrari F355 V8 (under the hood)<span>its real slow rev-up (2–7 s) when the speed-up rises, the drop at 7 s when it falls, the same rev-up held at the current rpm when it is steady. Source: <a href="https://freesound.org/people/enginemusic/sounds/43484/">"ferrari355underhood4.mp3"</a> by enginemusic, licensed under <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>; denoised, cut and resequenced.</span></figcaption></figure>
  </section>
  <section class="row"><h2>Cup stacking (q99)</h2>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_cup_huracan.mp4"></video><figcaption>A · Lamborghini Huracán V10, start-up only</figcaption></figure>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_cup_f355.mp4"></video><figcaption>B · Ferrari F355 V8 (under the hood)</figcaption></figure>
  </section>
  <section class="row"><h2>Towel folding (q95)</h2>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_towel_huracan.mp4"></video><figcaption>A · Lamborghini Huracán V10, start-up only</figcaption></figure>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_towel_f355.mp4"></video><figcaption>B · Ferrari F355 V8 (under the hood)</figcaption></figure>
  </section>
</main>
</body>
</html>
