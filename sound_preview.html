<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sound Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="static/css/style.css?v=d8124013">
<style>
  main { max-width: 1400px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 36px; }
  .row h2 { grid-column: 1 / -1; font-size: 1.15rem; margin: 0; }
  figure { margin: 0; }
  figure video { display: block; width: 100%; height: auto; border-radius: 10px; background: #101118; }
  figcaption { margin-top: 6px; font-weight: 600; }
  figcaption span { display: block; font-weight: 400; color: var(--muted); font-size: 0.9rem; }
  @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Sound options for the inference-time videos</h1>
  <p class="lead">Same videos, two sound tracks. Turn the sound on. Pick A or B; the chosen track replaces the current one on the main page.</p>
  <section class="row"><h2>Trash cleanup (q99)</h2>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_trash_supercar.mp4"></video>
      <figcaption>A · supercar engine<span>engine rpm follows the executed speed-up; crackle when it slows</span></figcaption></figure>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_trash_clock.mp4"></video>
      <figcaption>B · time effect (clock)<span>left: steady low tock every 3 actions at 1/15 s each · right: ticks every 3 executed actions, faster with the speed-up · swoosh when slower than 1/15 s</span></figcaption></figure>
  </section>
  <section class="row"><h2>Cup stacking (q99)</h2>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_cup_supercar.mp4"></video><figcaption>A · supercar engine</figcaption></figure>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_cup_clock.mp4"></video><figcaption>B · time effect (clock)</figcaption></figure>
  </section>
  <section class="row"><h2>Towel folding (q95)</h2>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_towel_supercar.mp4"></video><figcaption>A · supercar engine</figcaption></figure>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_towel_clock.mp4"></video><figcaption>B · time effect (clock)</figcaption></figure>
  </section>
</main>
</body>
</html>
