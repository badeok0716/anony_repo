<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sound Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="static/css/style.css?v=d8124013">
<style>
  main { max-width: 1400px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 36px; }
  .row h2 { grid-column: 1 / -1; font-size: 1.15rem; margin: 0; }
  figure { margin: 0; }
  figure video { display: block; width: 100%; height: auto; border-radius: 10px; background: #101118; }
  figcaption { margin-top: 6px; font-weight: 600; }
  figcaption span { display: block; font-weight: 400; color: var(--muted); font-size: 0.9rem; }
  @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Sound options for the inference-time videos</h1>
  <p class="lead">Same videos, two real engine recordings (CC0, lightly processed: denoised, looped, a little faster and louder with the speed-up). Turn the sound on. The main page has no sound for now.</p>
  <section class="row"><h2>Trash cleanup (q99)</h2>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_trash_huracan.mp4"></video>
      <figcaption>A · Lamborghini Huracán EVO V10<span>the real start-up at the beginning, then its idle, faster and louder with the speed-up. Source: Freesound #564373 by JaimeLopes, CC0.</span></figcaption></figure>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_trash_firebird.mp4"></video>
      <figcaption>B · Pontiac Firebird V8 (1975)<span>deep idle burble with a free exhaust, as recorded (no added layers). Source: Freesound #157142 by cr4sht3st, CC0.</span></figcaption></figure>
  </section>
  <section class="row"><h2>Cup stacking (q99)</h2>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_cup_huracan.mp4"></video><figcaption>A · Huracán V10</figcaption></figure>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_cup_firebird.mp4"></video><figcaption>B · Firebird V8</figcaption></figure>
  </section>
  <section class="row"><h2>Towel folding (q95)</h2>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_towel_huracan.mp4"></video><figcaption>A · Huracán V10</figcaption></figure>
    <figure><video controls playsinline preload="metadata" src="static/tempo/preview/split_towel_firebird.mp4"></video><figcaption>B · Firebird V8</figcaption></figure>
  </section>
</main>
</body>
</html>
